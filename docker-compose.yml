version: "3.9"

services:
  products-db:
    container_name: "accounts"
    image: postgres:14.0
    ports:
      - 5432:5432
    environment:
      - POSTGRES_DB=accounts
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
